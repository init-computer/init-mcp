name: Release
on:
  push:
    tags: ["sdk-v*", "cli-v*", "mcp-v*"]
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Check tag matches package version
        run: |
          name="${GITHUB_REF_NAME%%-v*}"
          version="${GITHUB_REF_NAME#*-v}"
          actual=$(node -p "require('./packages/$name/package.json').version")
          test "$version" = "$actual" || { echo "Tag $GITHUB_REF_NAME does not match packages/$name version $actual"; exit 1; }
          echo "PACKAGE=$name" >> "$GITHUB_ENV"
      - name: Publish to npm
        run: |
          version=$(node -p "require('./packages/$PACKAGE/package.json').version")
          if npm view "@init-computer/$PACKAGE@$version" version >/dev/null 2>&1; then
            echo "@init-computer/$PACKAGE@$version is already on npm"
          else
            npm publish -w "@init-computer/$PACKAGE" --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
